services:
  ollama:
    profiles:
      - ollama
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-8000}:8080
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ''
      WEBUI_NAME: 职鉴
      OFFLINE_MODE: 'true'
      ENABLE_VERSION_UPDATE_CHECK: 'false'
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [{"title":["职业方向评估","根据兴趣、技能和经历分析"],"content":"我适合哪些职业方向？请根据我的兴趣、技能、经历和价值观进行分析，并说明每个方向的匹配理由。"},{"title":["岗位匹配建议","从简历中找出适合岗位"],"content":"请根据我的简历内容，匹配适合投递的岗位类型，并按匹配度给出优先级和改进建议。"},{"title":["简历优化","面向目标岗位调整表达"],"content":"我想申请目标岗位，请帮我优化简历中的项目经历、技能描述和自我评价，让表达更符合岗位要求。"},{"title":["面试模拟","围绕目标岗位提问并反馈"],"content":"请针对我的目标岗位进行一次模拟面试，逐题提问，并在我回答后给出结构化反馈和改进示例。"},{"title":["职业转型路径","制定阶段性行动计划"],"content":"我想转型到新的职业方向，请帮我拆解需要补齐的能力、学习路径、作品或证书，以及三个月行动计划。"},{"title":["薪资与发展分析","判断机会是否值得选择"],"content":"请帮我分析一个岗位机会的薪资、成长空间、行业前景和风险，并给出是否值得选择的判断依据。"}]
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
